name: divination_app
description: 综合算命 App — 八字、紫微斗数、星座、塔罗、生肖、每日运势、起名测名、MBTI
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # 网络请求
  http: ^1.2.2
  # 本地存储
  shared_preferences: ^2.3.2
  # 状态管理
  provider: ^6.1.2
  # 路由
  go_router: ^14.2.7
  # UI 组件
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  # 时间处理
  intl: ^0.19.0
  # 动画
  lottie: ^3.1.2
  # WorkBuddy Cloud SDK（后端服务）
  # 需要在有 Flutter SDK 的环境中执行: flutter pub add 然后手动添加

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
